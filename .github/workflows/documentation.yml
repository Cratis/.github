name: Trigger documentation build
# Thin caller of the organization-wide documentation dispatcher in
# Cratis/Workflows/.github/workflows/trigger-documentation-build.yml, like every other repository.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

  push:
    branches: ["main"]
    paths:
      - "*.md"
      - "*.mdx"
      - "*.png"
      - "*.jpg"
      - "*.jpeg"
      - "*.gif"
      - "*.svg"
      - "*.webp"
      - "*.avif"
      - "release-digests/**"
      - "toc.yml"
      - "Documentation/**"

permissions:
  contents: read

jobs:
  trigger:
    uses: Cratis/Workflows/.github/workflows/trigger-documentation-build.yml@main
    secrets:
      PAT_DOCUMENTATION: ${{ secrets.PAT_DOCUMENTATION }}
