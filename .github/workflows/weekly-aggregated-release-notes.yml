name: Weekly Aggregated Release Notes

on:
  schedule:
    # 07:23 in Norway all year: 05:23 UTC in summer time, 06:23 UTC in winter time.
    # Both runs are harmless; only the run that creates the digest file posts to Discord.
    - cron: '23 5 * * 1'
    - cron: '23 6 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: Number of days to look back for releases
        required: false
        default: '7'
        type: string

concurrency:
  group: weekly-release-digest-main
  cancel-in-progress: false

jobs:
  aggregate-release-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Collect week in numbers
        id: numbers
        uses: actions/github-script@v8
        env:
          DAYS: ${{ inputs.days || '7' }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { collectOrgStats } = require(path.join(process.env.GITHUB_WORKSPACE, '.github/scripts/collect-org-stats.cjs'));
            const days = Number(process.env.DAYS || '7');
            if (!Number.isInteger(days) || days < 1 || days > 365) throw new Error('DAYS must be an integer from 1 to 365');
            const now = new Date();
            const since = new Date(now.getTime() - days * 86400000).toISOString();
            // The digest must not depend on the statistics: without them it is published without that section.
            let numbers = null;
            try {
              ({ numbers } = await collectOrgStats({ github, org: context.repo.owner, now, digestSince: since }));
            } catch (error) {
              core.warning(`Week in numbers unavailable: ${error.message}`);
            }
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'weekly-numbers.json'), JSON.stringify(numbers));
            core.setOutput('since', since);
            core.setOutput('until', now.toISOString());
            core.setOutput('filename', `release-digests/${since.slice(0, 10)}-to-${now.toISOString().slice(0, 10)}.md`);

      - name: Collect releases from organization repositories
        id: collect
        uses: actions/github-script@v8
        env:
          DAYS: ${{ inputs.days || '7' }}
          SINCE: ${{ steps.numbers.outputs.since }}
          UNTIL: ${{ steps.numbers.outputs.until }}
        with:
          # Public collection needs no organization-wide PAT access.
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const org = context.repo.owner;
            const days = Number(process.env.DAYS || '7');
            const since = process.env.SINCE ? new Date(process.env.SINCE) : new Date(Date.now() - days * 24 * 60 * 60 * 1000);

            const { collectPublicReleases } = require(path.join(process.env.GITHUB_WORKSPACE, '.github/scripts/collect-public-releases.cjs'));
            const { releases, versionMovements } = await collectPublicReleases({ github, org, since, until: process.env.UNTIL && new Date(process.env.UNTIL) });

            const workspace = process.env.GITHUB_WORKSPACE;
            fs.writeFileSync(path.join(workspace, 'weekly-releases.json'), JSON.stringify(releases, null, 2));
            fs.writeFileSync(path.join(workspace, 'weekly-version-movements.json'), JSON.stringify(versionMovements, null, 2));

            core.setOutput('count', `${releases.length}`);
            core.setOutput('since', since.toISOString());

      - name: Summarize releases by category
        id: summarize
        uses: actions/github-script@v8
        env:
          DAYS: ${{ inputs.days || '7' }}
          SINCE: ${{ steps.numbers.outputs.since }}
          UNTIL: ${{ steps.numbers.outputs.until }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const releasesPath = path.join(process.env.GITHUB_WORKSPACE, 'weekly-releases.json');
            const releases = JSON.parse(fs.readFileSync(releasesPath, 'utf8'));
            const versionMovementsPath = path.join(process.env.GITHUB_WORKSPACE, 'weekly-version-movements.json');
            const versionMovements = JSON.parse(fs.readFileSync(versionMovementsPath, 'utf8'));
            const days = Number(process.env.DAYS || '7');
            const now = process.env.UNTIL ? new Date(process.env.UNTIL) : new Date();
            const startDate = (process.env.SINCE || new Date(now.getTime() - days * 24 * 60 * 60 * 1000).toISOString()).slice(0, 10);
            const endDate = now.toISOString().slice(0, 10);

            const categories = ['Added', 'Changed', 'Fixed', 'Removed', 'Security', 'Deprecated'];
            const normalizedToCanonical = new Map(categories.map(category => [category.toLowerCase(), category]));
            const grouped = Object.fromEntries(categories.map(category => [category, []]));

            function isNoUpdateItem(item) {
              const normalized = String(item || '')
                .replace(/[`*_~]/g, '')
                .replace(/\s*\(#\d+\)\s*$/g, '')
                .trim()
                .toLowerCase()
                .replace(/[.!]+$/g, '');

              if (!normalized) {
                return true;
              }

              const exactNoUpdateValues = new Set([
                'none',
                'n/a',
                'na',
                'nothing',
                'no change',
                'no changes',
                'no update',
                'no updates',
                'no fixes',
                'no fix',
                'nothing to report',
                'not applicable'
              ]);

              if (exactNoUpdateValues.has(normalized)) {
                return true;
              }

              return /^no\s+(new\s+)?(changes?|updates?|fixes?|additions?|removals?|deprecations?|security\s+changes?)\b/.test(normalized) ||
                /^nothing\s+(new|to\s+report|was\s+(added|changed|fixed|removed|deprecated|done)|has\s+changed)\b/.test(normalized) ||
                /^there\s+(are|were)\s+no\s+(changes?|updates?|fixes?|additions?|removals?|deprecations?)\b/.test(normalized);
            }

            function parseReleaseBody(body) {
              const parsed = Object.fromEntries(categories.map(category => [category, []]));
              const normalizedBody = String(body || '').replace(/\r\n/g, '\n');
              const lines = normalizedBody.split('\n');
              let activeCategory = null;

              for (const rawLine of lines) {
                const line = rawLine.trim();
                const headingMatch = line.match(/^#{1,6}\s*(Added|Changed|Fixed|Removed|Security|Deprecated)\b/i);
                if (headingMatch) {
                  activeCategory = normalizedToCanonical.get(headingMatch[1].toLowerCase()) || null;
                  continue;
                }

                if (!activeCategory || !line) {
                  continue;
                }

                const bulletMatch = line.match(/^[-*]\s+(.+)$/);
                const numberedMatch = line.match(/^\d+\.\s+(.+)$/);
                if (bulletMatch) {
                  const item = bulletMatch[1].trim();
                  if (!isNoUpdateItem(item)) {
                    parsed[activeCategory].push(item);
                  }
                  continue;
                }

                if (numberedMatch) {
                  const item = numberedMatch[1].trim();
                  if (!isNoUpdateItem(item)) {
                    parsed[activeCategory].push(item);
                  }
                }
              }

              return parsed;
            }

            for (const release of releases) {
              const parsed = parseReleaseBody(release.body);
              for (const category of categories) {
                for (const item of parsed[category]) {
                  grouped[category].push(`- **${release.repository}** ([${release.title}](${release.url})): ${item}`);
                }
              }
            }

            const { renderWeekNumbers } = require(path.join(process.env.GITHUB_WORKSPACE, '.github/scripts/render-org-stats.cjs'));
            const numbers = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'weekly-numbers.json'), 'utf8'));
            const summaryLines = [
              `# Release digest for week of ${startDate} to ${endDate}`,
              '',
              ...(numbers ? [renderWeekNumbers(numbers)] : []),
              '## Version movement',
              '',
              '| Repository | Previous version | Current version |',
              '| --- | --- | --- |'
            ];
            for (const movement of versionMovements) {
              const previousVersion = movement.previous
                ? `[${movement.previous.tag}](${movement.previous.url})`
                : 'First release';
              const currentVersion = `[${movement.current.tag}](${movement.current.url})`;
              summaryLines.push(`| [${movement.repository}](${movement.repositoryUrl}) | ${previousVersion} | ${currentVersion} |`);
            }
            summaryLines.push('');

            for (const category of categories) {
              summaryLines.push(`## ${category}`);
              if (grouped[category].length) {
                summaryLines.push(...grouped[category]);
              } else {
                summaryLines.push('- No updates');
              }
              summaryLines.push('');
            }

            // Share the final renderer with offline historical digest regeneration.
            const { renderReleaseDigest } = require(path.join(process.env.GITHUB_WORKSPACE, '.github/scripts/render-release-digest.cjs'));
            const summary = renderReleaseDigest(summaryLines.join('\n'));

            fs.writeFileSync(path.join(process.env.GITHUB_WORKSPACE, 'weekly-release-summary.md'), summary);

      - name: Commit release digest to repository
        id: commit
        env:
          FILENAME: ${{ steps.numbers.outputs.filename }}
        run: |
          mkdir -p release-digests
          if [ -e "${FILENAME}" ]; then echo "created=false" >> "$GITHUB_OUTPUT"; else echo "created=true" >> "$GITHUB_OUTPUT"; fi
          cp weekly-release-summary.md "${FILENAME}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${FILENAME}"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: add weekly release digest ${FILENAME}"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          exit 1

      - name: Share weekly digest on Discord
        if: steps.commit.outputs.created == 'true'
        uses: actions/github-script@v8
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DIGEST_FILE: ${{ steps.numbers.outputs.filename }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { weeklyDiscord } = require(path.join(process.env.GITHUB_WORKSPACE, '.github/scripts/render-org-stats.cjs'));
            const { postDiscord } = require(path.join(process.env.GITHUB_WORKSPACE, '.github/scripts/publish-org-stats.cjs'));
            const numbers = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'weekly-numbers.json'), 'utf8'));
            if (!numbers) {
              core.notice('Week in numbers unavailable; nothing to share on Discord.');
              return;
            }
            const url = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/${process.env.DIGEST_FILE}`;
            await postDiscord({ webhook: process.env.DISCORD_WEBHOOK_URL, payload: weeklyDiscord(numbers, url), notice: core.notice, warning: core.warning });
